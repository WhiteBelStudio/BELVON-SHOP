name: BELVON SHOP Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform files
        run: flutter create --platforms=android .
      - name: Restore project test files
        run: git checkout -- test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK installer
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform files
        run: flutter create --platforms=windows .
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          @"
          [Setup]
          AppName=BELVON SHOP
          AppVersion=1.3.1
          AppPublisher=WhiteBelStudio
          DefaultDirName={autopf}\BELVON SHOP
          DefaultGroupName=BELVON SHOP
          OutputDir=.
          OutputBaseFilename=BELVON-SHOP-Windows-Setup-1.3.1
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=BELVON SHOP
          PrivilegesRequired=lowest
          DisableProgramGroupPage=yes
          WizardStyle=modern
          SetupIconFile=icon.ico

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\BELVON SHOP"; Filename: "{app}\belvon_shop.exe"
          Name: "{group}\BELVON SHOP"; Filename: "{app}\belvon_shop.exe"

          [Run]
          Filename: "{app}\belvon_shop.exe"; Description: "Запустить BELVON SHOP"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 installer.iss
          if (Test-Path "windows\runner\resources\app_icon.ico") {
            Copy-Item "windows\runner\resources\app_icon.ico" "icon.ico"
            (Get-Content installer.iss) -replace 'SetupIconFile=icon.ico','SetupIconFile=icon.ico' | Set-Content -Encoding UTF8 installer.iss
          } else {
            (Get-Content installer.iss) | Where-Object { $_ -ne 'SetupIconFile=icon.ico' } | Set-Content -Encoding UTF8 installer.iss
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-Windows-Installer
          path: BELVON-SHOP-Windows-Setup-1.3.1.exe

  macos:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform files
        run: flutter create --platforms=macos .
      - name: Get dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create macOS DMG installer
        run: |
          mkdir -p dmg-root
          cp -R build/macos/Build/Products/Release/belvon_shop.app "dmg-root/BELVON SHOP.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create -volname "BELVON SHOP" -srcfolder dmg-root -ov -format UDZO BELVON-SHOP-macOS-Installer-1.3.1.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-macOS-Installer
          path: BELVON-SHOP-macOS-Installer-1.3.1.dmg

  ios:
    name: iOS IPA package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform files
        run: flutter create --platforms=ios .
      - name: Get dependencies
        run: flutter pub get
      - name: Prepare unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Create unsigned IPA package
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/BELVON\ SHOP.app
          zip -r BELVON-SHOP-iOS-unsigned-1.3.1.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-iOS-IPA
          path: BELVON-SHOP-iOS-unsigned-1.3.1.ipa

  release:
    name: Publish BELVON SHOP 1.3.1
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        run: |
          mkdir -p flat
          find release-assets -type f -exec cp {} flat/ \;
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: BELVON SHOP 1.3.1
          body: |
            BELVON SHOP 1.3.1

            Security release:
            - Owner login uses primary password + additional owner password.
            - Owner login IP address and user-agent are recorded in the owner audit log.
            - Cross-platform installers are built for Windows, Android, macOS and iOS package preparation.

            Windows and macOS are distributed as native installers/packages.
            iOS IPA is unsigned and requires Apple signing/provisioning before installation on a physical device.
          files: flat/*
          make_latest: true
