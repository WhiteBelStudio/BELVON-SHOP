name: BELVON SHOP Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  API_BASE_URL: https://belvonshop-c08vk0tne-neon-messenger-4294.vercel.app

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read app version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"
      - name: Validate production API configuration
        run: test -n "$API_BASE_URL" && echo "Production API configured" || (echo "Production API URL is required" && exit 1)
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          EXPECTED="v$APP_VERSION"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || {
            echo "Release tag $GITHUB_REF_NAME does not match pubspec version $EXPECTED"
            exit 1
          }
      - name: Generate Flutter platform files
        run: flutter create --platforms=android .
      - name: Restore project test files
        run: git checkout -- test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run automated tests
        run: flutter test --reporter expanded
      - name: Build APK installer
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=APP_VERSION="$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-Android-${{ env.APP_VERSION }}
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read app version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          if (-not $line) { throw "Version not found in pubspec.yaml" }
          $version = $line.Matches[0].Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "App version: $version"
      - name: Validate production API configuration
        shell: pwsh
        run: if (-not $env:API_BASE_URL) { throw "Production API URL is required" }
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v$env:APP_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match pubspec version $expected"
          }
      - name: Generate Flutter platform files
        run: flutter create --platforms=windows .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Windows
        run: flutter build windows --release --dart-define=API_BASE_URL="$env:API_BASE_URL" --dart-define=APP_VERSION="$env:APP_VERSION"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $version = $env:APP_VERSION
          $iss = @"
          [Setup]
          AppName=BELVON SHOP
          AppVersion=$version
          AppPublisher=WhiteBelStudio
          DefaultDirName={autopf}\BELVON SHOP
          DefaultGroupName=BELVON SHOP
          OutputDir=.
          OutputBaseFilename=BELVON-SHOP-Windows-Setup-$version
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=BELVON SHOP
          PrivilegesRequired=lowest
          DisableProgramGroupPage=yes
          WizardStyle=modern
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}\BELVON SHOP"; Filename: "{app}\belvon_shop.exe"
          Name: "{group}\BELVON SHOP"; Filename: "{app}\belvon_shop.exe"
          [Run]
          Filename: "{app}\belvon_shop.exe"; Description: "Запустить BELVON SHOP"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BELVON-SHOP-Windows-Installer
          path: BELVON-SHOP-Windows-Setup-*.exe

  release:
    name: Publish BELVON SHOP Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '1.3.4'))
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        run: |
          mkdir -p flat
          find release-assets -type f -exec cp {} flat/ \;
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BELVON SHOP v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: flat/*
          make_latest: true
          target_commitish: ${{ github.sha }}
