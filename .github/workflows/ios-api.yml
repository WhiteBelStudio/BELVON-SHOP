name: iOS Production API and Version Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  API_BASE_URL: https://belvonshop-c08vk0tne-neon-messenger-4294.vercel.app

jobs:
  ios-api:
    name: iOS Production API
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        shell: bash
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1)
          VERSION=${VERSION_LINE#version: }
          VERSION=${VERSION// /}
          APP_VERSION=${VERSION%%+*}
          BUILD_NUMBER=${VERSION#*+}
          if [ "$APP_VERSION" = "$VERSION" ]; then BUILD_NUMBER="$APP_VERSION"; fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "iOS marketing version: $APP_VERSION"
          echo "iOS build number: $BUILD_NUMBER"

      - name: Validate version format
        shell: bash
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          test "$APP_VERSION" = "1.3.3"
          test "$BUILD_NUMBER" = "8"

      - name: Validate production API URL
        shell: bash
        run: |
          test "$API_BASE_URL" = "https://belvonshop-c08vk0tne-neon-messenger-4294.vercel.app"
          echo "Production API: $API_BASE_URL"

      - name: Check production API health
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --max-time 15 \
            "$API_BASE_URL/health/live"
          echo
          echo "Production API health check passed."

      - name: Generate iOS platform files
        run: flutter create --platforms=ios .

      - name: Restore project test files
        run: git checkout -- test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart API configuration
        shell: bash
        run: |
          grep -q "String.fromEnvironment('API_BASE_URL')" lib/services/api_service.dart
          echo "API_BASE_URL is wired through Dart compile-time configuration."

      - name: Verify iOS version mapping
        shell: bash
        run: |
          grep -q 'CURRENT_PROJECT_VERSION = "$(FLUTTER_BUILD_NUMBER)";' ios/Runner.xcodeproj/project.pbxproj
          grep -q '$(FLUTTER_BUILD_NAME)' ios/Runner/Info.plist
          grep -q '$(FLUTTER_BUILD_NUMBER)' ios/Runner/Info.plist
          echo "iOS version/build mapping is configured."

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Verify analyzer completed cleanly
        shell: bash
        run: |
          flutter analyze --no-pub --fatal-infos --fatal-warnings
          echo "iOS static analysis is clean."

      - name: Run automated tests
        run: flutter test --reporter expanded

      - name: Build iOS with production API
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
